.btn:active{background:var(--hot2)}
.ghost{font-size:13px;color:var(--sub);margin-left:10px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f7efdc;font-size:13px}
.tw{overflow-x:auto}
ol.crit{padding-left:20px;margin:0}ol.crit li{margin-bottom:8px}

.cats h3{font-size:14px;color:var(--sub);margin:18px 0 6px}
.cats ul{margin:0;padding-left:18px}.cats li{margin-bottom:3px}
footer{margin-top:40px;padding:20px 0 40px;border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
@media(min-width:560px){.card{grid-template-columns:120px 1fr}.card img{width:120px;height:120px}}
